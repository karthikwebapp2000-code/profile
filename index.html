<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #334155, #7c3aed);
            color: #fff;
        }
        .card {
            width: min(700px, 100%);
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.25);
        }
        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
        }
        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 4vw, 3rem);
        }
        p {
            margin: 0 auto 24px;
            max-width: 560px;
            line-height: 1.7;
            color: #dbeafe;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        a {
            display: inline-block;
            padding: 12px 18px;
            background: #fff;
            color: #0f172a;
            text-decoration: none;
            border-radius: 999px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }
        a:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👋</div>
        <h1>Hi, I'm Karthik</h1>
        <p>
            I build modern web apps and enjoy creating beautiful, responsive experiences.
            This profile page is deployed as a GitHub Pages site.
        </p>
        <div class="links">
            <a href="https://github.com/karthikwebapp2000-code" target="_blank" rel="noreferrer">GitHub</a>
            <a href="mailto:karthik@example.com">Email</a>
        </div>
    </div>
</body>
</html>
